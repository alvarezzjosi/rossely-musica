<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cuenta regresiva Rossely</title>

    <!-- Fuente -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =============================
           CONFIGURACIÓN GENERAL
        ============================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: transparent !important;

            font-family: "Montserrat", sans-serif;

            overflow: hidden;
        }


        /* =============================
           CONTENEDOR
        ============================== */

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contador {
            width: 100%;
            max-width: 650px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: clamp(12px, 4vw, 35px);

            padding: 20px 10px;

            background: transparent;
        }


        /* =============================
           CADA BLOQUE
        ============================== */

        .unidad {
            min-width: 60px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }


        /* =============================
           NÚMEROS
        ============================== */

        .numero {
            color: #B88A3B;

            font-size: clamp(32px, 9vw, 62px);
            font-weight: 600;

            line-height: 1;

            letter-spacing: -1px;

            transition:
                transform 0.18s ease,
                opacity 0.18s ease;
        }


        /* =============================
           ETIQUETAS
        ============================== */

        .etiqueta {
            margin-top: 8px;

            color: #7A6757;

            font-size: clamp(10px, 2.7vw, 15px);
            font-weight: 500;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }


        /* =============================
           ANIMACIÓN AL CAMBIAR
        ============================== */

        .numero.cambio {
            transform: scale(1.08);
            opacity: 0.8;
        }


        /* =============================
           RESPONSIVE
        ============================== */

        @media (max-width: 420px) {

            .contador {
                gap: 10px;
            }

            .unidad {
                min-width: 52px;
            }

        }

    </style>
</head>


<body>

    <div class="contador">

        <div class="unidad">
            <span
                class="numero"
                id="dias"
            >00</span>

            <span class="etiqueta">
                Días
            </span>
        </div>


        <div class="unidad">
            <span
                class="numero"
                id="horas"
            >00</span>

            <span class="etiqueta">
                Horas
            </span>
        </div>


        <div class="unidad">
            <span
                class="numero"
                id="minutos"
            >00</span>

            <span class="etiqueta">
                Minutos
            </span>
        </div>


        <div class="unidad">
            <span
                class="numero"
                id="segundos"
            >00</span>

            <span class="etiqueta">
                Segundos
            </span>
        </div>

    </div>


    <script>

        /*
        =========================================
        FECHA OBJETIVO

        28 de noviembre de 2026
        20:00 h
        Paraguay
        =========================================
        */

        const fechaEvento =
            new Date("2026-11-28T20:00:00-03:00");


        const dias =
            document.getElementById("dias");

        const horas =
            document.getElementById("horas");

        const minutos =
            document.getElementById("minutos");

        const segundos =
            document.getElementById("segundos");


        /*
        =========================================
        FUNCIÓN PARA ACTUALIZAR NÚMEROS
        =========================================
        */

        function cambiarNumero(elemento, nuevoValor) {

            if (elemento.textContent !== nuevoValor) {

                elemento.classList.add("cambio");

                setTimeout(() => {
                    elemento.textContent = nuevoValor;
                    elemento.classList.remove("cambio");
                }, 90);

            }

        }


        /*
        =========================================
        CUENTA REGRESIVA
        =========================================
        */

        function actualizarContador() {

            const ahora = new Date();

            let diferencia =
                fechaEvento.getTime() - ahora.getTime();


            /*
            Si ya llegó la fecha
            */

            if (diferencia <= 0) {

                dias.textContent = "00";
                horas.textContent = "00";
                minutos.textContent = "00";
                segundos.textContent = "00";

                return;
            }


            /*
            Cálculos
            */

            const totalDias =
                Math.floor(
                    diferencia /
                    (1000 * 60 * 60 * 24)
                );


            const totalHoras =
                Math.floor(
                    (diferencia /
                    (1000 * 60 * 60)) % 24
                );


            const totalMinutos =
                Math.floor(
                    (diferencia /
                    (1000 * 60)) % 60
                );


            const totalSegundos =
                Math.floor(
                    (diferencia / 1000) % 60
                );


            /*
            Mostrar
            */

            cambiarNumero(
                dias,
                String(totalDias)
            );

            cambiarNumero(
                horas,
                String(totalHoras).padStart(2, "0")
            );

            cambiarNumero(
                minutos,
                String(totalMinutos).padStart(2, "0")
            );

            cambiarNumero(
                segundos,
                String(totalSegundos).padStart(2, "0")
            );

        }


        /*
        Ejecutar inmediatamente
        */

        actualizarContador();


        /*
        Actualizar cada segundo
        */

        setInterval(
            actualizarContador,
            1000
        );

    </script>

</body>
</html>
